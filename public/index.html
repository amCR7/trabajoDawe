<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>TecnoManía</title>

    <meta name="description" content="Descripcion">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Favicon -->
    <link rel="icon" href="imagenes/favicon.ico">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
<div id="contenedor">

    <!-- CABECERA -->
    <header>
        <h1 class="m-0 p-3">TecnoManía</h1>
        <nav>
            <ul class="m-0 px-3 py-2 d-flex gap-4 list-unstyled">
                <li><a href="#" class="text-white text-decoration-none">Inicio</a></li>
                <li><a href="#" class="text-white text-decoration-none" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCarrito" aria-controls="offcanvasCarrito">Carrito</a></li>

            </ul>
        </nav>
    </header>

    <!-- CONTENIDO -->
    <div id="contenido" class="d-flex gap-3 p-3">

        <!-- ASIDE -->
        <aside id="panel-lateral" class="p-3 border rounded" style="width:300px;">
            <h2 class="h5 mb-3">Añadir producto</h2>

            <form id="formulario-producto">

                <div class="mb-3">
                    <label for="tipo-producto" class="form-label">Tipo de producto</label>
                    <select id="tipo-producto" class="form-select" required>
                        <option value="">Escoge un tipo</option>
                        <option value="televisor">Televisor</option>
                        <option value="smartphone">Smartphone</option>
                        <option value="audio">Audio (altavoz / auriculares)</option>
                        <option value="accesorio">Accesorio</option>
                        <option value="videojuego">Videojuego</option>
                    </select>
                </div>


                <div class="mb-3">
                    <label for="nombre-producto" class="form-label">Nombre</label>
                    <input type="text" id="nombre-producto" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="precio-producto" class="form-label">Precio</label>
                    <input type="number" id="precio-producto" class="form-control" min="0" step="0.01" required>
                </div>

                <div class="mb-3">
                    <label for="descripcion-producto" class="form-label">Descripción</label>
                    <textarea id="descripcion-producto" class="form-control" rows="3"></textarea>
                </div>

                <div id="campo-extra-container" class="mb-3"></div>

                <div class="mb-3">
                    <label for="archivo-imagen" class="form-label">Imagen</label>
                    <input type="file" id="archivo-imagen" class="form-control">
                </div>

                <div id="drag-drop-area" class="drag-drop-area mb-3">
                    <p class="m-0">Arrastra una imagen aquí o haz clic</p>
                </div>

                <div id="mensaje-formulario" class="small"></div>

                <button type="submit" class="btn btn-primary w-100">
                    Añadir producto
                </button>
            </form>
        </aside>

        
        <!-- MAIN -->
        <main id="principal" class="p-3 flex-fill">

            <div class="d-flex justify-content-between align-items-center gap-3">
                <h2 class="h4 m-0">Todos los productos</h2>
                <input id="buscador" class="form-control" style="max-width:320px" placeholder="Buscar por nombre">
            </div>

            <hr>

            <div id="grid-productos" class="row g-3">
 
            </div>

            <div id="info-paginacion" class="text-center mt-3">
                Mostrando 0 de 0
            </div>

            <div class="d-flex justify-content-center mt-3">                
                <div id="paginacion" class="d-flex justify-content-center">
                </div>
            </div>

        </main>
    </div>

    <!-- FOOTER -->
    <footer id="pie-pagina" class="py-3 px-4">
        <p class="m-0 text-center">&copy; 2026 TecnoManía</p>
    </footer>

</div>

    <!-- OFFCANVAS CARRITO -->
<div class="offcanvas offcanvas-end"
tabindex="-1"
id="offcanvasCarrito"
aria-labelledby="offcanvasCarritoLabel">

<div class="offcanvas-header">
   <h5 id="offcanvasCarritoLabel">Carrito de la compra</h5>
   <button type="button"
           class="btn-close"
           data-bs-dismiss="offcanvas"
           aria-label="Cerrar"></button>
</div>

<div class="offcanvas-body">
   <div id="carrito-productos" style="max-height: 400px; overflow-y: auto;"></div>
   <hr>
   <div id="carrito-total" class="fw-bold"></div>
</div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS principal -->
<script type="module" src="js/main.js"></script>


</body>
</html>
